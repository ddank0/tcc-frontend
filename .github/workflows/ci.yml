name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # O runner de teste é Vitest, não Karma: a flag --browsers não se aplica.
      - name: Testes
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build do estágio de produção
        run: docker build --target prod -t tcc-frontend:prod .
